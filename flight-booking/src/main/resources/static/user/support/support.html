<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Request</title>
    <link rel="stylesheet" href="/support/styles/style.css">
    <script src="/scripts/sessionHome.js" defer></script>
    <script src="/support/scripts/script.js" defer></script>
</head>
<body>
<div class="page-container">
    <h1>Create Support Request</h1>
    <p>Submit a request for help with your booking. A manager will review it.</p>

    <form id="ticketForm">
        <label for="bookingId">Booking ID</label>
        <input type="number" id="bookingId" required>

        <label for="customerName">Name</label>
        <input type="text" id="customerName" required>

        <label for="customerEmail">Email</label>
        <input type="email" id="customerEmail" required>

        <label for="requestType">Request Type</label>
        <select id="requestType" required>
            <option value="CHANGE_BOOKING">Change Booking</option>
            <option value="REFUND">Refund</option>
            <option value="OTHER">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" required></textarea>

        <button type="submit">Submit Request</button>
    </form>

    <p id="result"></p>
</div>

<div class="footer-divider"></div>
<footer>
    <a href="/manager" class="footer-left">Operations Console</a>

    <div class="footer-center">
        <div class="footer-logos">
            <img src="/images/Award_1.png">
            <img src="/images/Award_2.png">
            <img src="/images/Award_3.png">
        </div>
        <p class="footer-info">© 2026 Astraeus Airlines · All rights reserved</p>
        <p class="footer-trust">Trusted worldwide · Secure booking · 24/7 support</p>
    </div>

    <div class="footer-right">Astraeus UK</div>
</footer>

<script src="script.js"></script>
</body>
</html>
